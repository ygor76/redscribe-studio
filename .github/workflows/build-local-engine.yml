name: Build RedScribe Local Engine

on:
  push:
    branches: [main]
    paths:
      - 'local_engine/**'
      - '.github/workflows/build-local-engine.yml'
      - 'RedScribe_Studio_5.0.0_Railway_Original.zip'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Prepare bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build\src | Out-Null
          New-Item -ItemType Directory -Force -Path build\bundle\app | Out-Null
          New-Item -ItemType Directory -Force -Path build\bundle\runtime\Lib\site-packages | Out-Null
          New-Item -ItemType Directory -Force -Path build\bundle\tools | Out-Null

          Expand-Archive -Path 'RedScribe_Studio_5.0.0_Railway_Original.zip' -DestinationPath 'build\src' -Force
          $sourceDir = Get-ChildItem 'build\src' -Directory | Select-Object -First 1
          if (-not $sourceDir) { throw 'Pasta fonte do RedScribe não encontrada dentro do ZIP.' }
          Copy-Item "$($sourceDir.FullName)\*" 'build\bundle\app' -Recurse -Force
          Copy-Item 'local_engine\bridge_bootstrap.py' 'build\bundle\app\bridge_bootstrap.py' -Force
          Copy-Item 'local_engine\INICIAR_REDSCRIBE_LOCAL_ENGINE.cmd' 'build\bundle\INICIAR_REDSCRIBE_LOCAL_ENGINE.cmd' -Force
          Copy-Item 'local_engine\DIAGNOSTICO_LOCAL_ENGINE.cmd' 'build\bundle\DIAGNOSTICO_LOCAL_ENGINE.cmd' -Force
          Copy-Item 'local_engine\LEIA-ME.txt' 'build\bundle\LEIA-ME.txt' -Force

      - name: Install portable Python runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pyVersion = '3.12.10'
          $zip = 'build\python-embed.zip'
          Invoke-WebRequest "https://www.python.org/ftp/python/$pyVersion/python-$pyVersion-embed-amd64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath 'build\bundle\runtime' -Force

          $pth = 'build\bundle\runtime\python312._pth'
          $lines = Get-Content $pth
          $lines = $lines | ForEach-Object { if ($_ -eq '#import site') { 'import site' } else { $_ } }
          if (-not ($lines -contains 'Lib\site-packages')) { $lines += 'Lib\site-packages' }
          Set-Content -Path $pth -Value $lines -Encoding ASCII

      - name: Install RedScribe dependencies into portable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --only-binary=:all: --target 'build\bundle\runtime\Lib\site-packages' -r 'local_engine\requirements-local-engine.txt'

      - name: Add yt-dlp and Deno tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile 'build\bundle\tools\yt-dlp.exe'
          Invoke-WebRequest 'https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip' -OutFile 'build\deno.zip'
          Expand-Archive -Path 'build\deno.zip' -DestinationPath 'build\deno' -Force
          Copy-Item 'build\deno\deno.exe' 'build\bundle\tools\deno.exe' -Force

      - name: Smoke test portable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$pwd\build\bundle\tools;$env:PATH"
          $env:PYTHONPATH = "$pwd\build\bundle\app;$pwd\build\bundle\runtime\Lib\site-packages"
          $env:REDSCRIBE_OPEN_WEB = '0'
          & 'build\bundle\runtime\python.exe' -c "import flask, yt_dlp, faster_whisper, cv2, imageio_ffmpeg; print('runtime imports OK')"
          & 'build\bundle\tools\deno.exe' --version
          & 'build\bundle\tools\yt-dlp.exe' --version

      - name: Package artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path 'build\bundle\*' -DestinationPath 'RedScribe_Local_Engine_5.1.0_Windows.zip' -CompressionLevel Optimal -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedScribe_Local_Engine_5.1.0_Windows
          path: RedScribe_Local_Engine_5.1.0_Windows.zip
          if-no-files-found: error
          retention-days: 30
